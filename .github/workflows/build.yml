name: Build Happy Trading Alarm

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "::error::Android SDK Platform 35 is not installed."
            exit 1
          }

      - name: Install Custom PNG Launcher Icon
        shell: bash
        run: |
          set -e

          if [ ! -f "app-icon.png" ]; then
            echo "::error::app-icon.png not found in repository root."
            exit 1
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found."
            exit 1
          fi

          mkdir -p app/src/main/res/drawable-nodpi

          cp app-icon.png \
            app/src/main/res/drawable-nodpi/ic_custom_launcher.png

          echo "Custom icon copied successfully."

      - name: Configure Launcher Icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'android:icon\s*=\s*"[^"]*"',
              'android:icon="@drawable/ic_custom_launcher"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "Could not find android:icon in AndroidManifest.xml"
              )

          updated = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              updated,
              count=1
          )

          manifest.write_text(updated, encoding="utf-8")
          print("Launcher icon configured successfully.")
          PY

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Trading-Alarm-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
