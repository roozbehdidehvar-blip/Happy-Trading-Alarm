name: Build Happy Trading Alarm Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "::error::Android SDK Platform 35 is not installed."
            exit 1
          }

      - name: Install Custom Launcher Icon
        shell: bash
        run: |
          set -e

          test -f app-icon.png || {
            echo "::error::app-icon.png not found."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "::error::AndroidManifest.xml not found."
            exit 1
          }

          mkdir -p app/src/main/res/drawable-nodpi
          cp app-icon.png app/src/main/res/drawable-nodpi/ic_custom_launcher.png

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'android:icon\s*=\s*"[^"]*"',
              'android:icon="@drawable/ic_custom_launcher"',
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("Could not find android:icon in AndroidManifest.xml")

          updated = re.sub(
              r'\s+android:roundIcon\s*=\s*"[^"]*"',
              '',
              updated,
              count=1
          )

          manifest.write_text(updated, encoding="utf-8")
          print("Launcher icon configured.")
          PY

      - name: Restore Release Signing Key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

          test -s app/release-key.jks || {
            echo "::error::Release signing key is empty."
            exit 1
          }

          echo "Release signing key restored."

      - name: Build Signed Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          gradle assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Happy-Trading-Alarm-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove Temporary Signing Key
        if: always()
        run: rm -f app/release-key.jks
