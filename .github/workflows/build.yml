name: Build Happy Trading Alarm APK

on:
push:
branches:
- main
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set Up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set Up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Custom PNG Launcher Icon
    shell: bash
    run: |
      set -e

      ICON="app-icon.png"

      if [ ! -f "$ICON" ]; then
        echo "::error::File app-icon.png was not found in repository root."
        exit 1
      fi

      if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
        echo "::error::AndroidManifest.xml was not found."
        exit 1
      fi

      mkdir -p app/src/main/res/drawable-nodpi

      cp "$ICON" \
        app/src/main/res/drawable-nodpi/ic_custom_launcher.png

      echo "Custom PNG icon copied successfully."

  - name: Configure Launcher Icon
    shell: bash
    run: |
      python3 - <<'PY'
      from pathlib import Path
      import re

      manifest = Path("app/src/main/AndroidManifest.xml")
      text = manifest.read_text(encoding="utf-8")

      replacement = '@drawable/ic_custom_launcher'

      updated, count_icon = re.subn(
          r'android:icon\s*=\s*"[^"]*"',
          f'android:icon="{replacement}"',
          text,
          count=1
      )

      if count_icon != 1:
          raise SystemExit(
              "Could not find android:icon in AndroidManifest.xml"
          )

      updated, count_round = re.subn(
          r'\s+android:roundIcon\s*=\s*"[^"]*"',
          '',
          updated,
          count=1
      )

      manifest.write_text(updated, encoding="utf-8")
      print("Launcher icon configured successfully.")
      PY

  - name: Grant Gradle Permission
    run: chmod +x ./gradlew

  - name: Build Debug APK
    run: ./gradlew assembleDebug --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Happy-Trading-Alarm-APK
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
