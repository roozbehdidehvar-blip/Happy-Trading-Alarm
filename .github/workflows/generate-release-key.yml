## مرحله بعد چیست؟

بعد از تکمیل این مراحل، به من بگو **آیا Secret به نام `RELEASE_KEYSTORE_BASE64` را هم ساخته‌ای؟**

سپس فایل `build.yml` را اصلاح می‌کنیم تا به‌جای APK دیباگ، نسخه **Release امضاشده با کلید اختصاصی** بسازد و خروجی را برای بارگذاری در کافه‌بازار آماده کند.
