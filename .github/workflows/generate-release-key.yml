name: Generate Release Signing Key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Signing Key
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -e

          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing."
            exit 1
          fi

          if [ -f release-key.jks ]; then
            echo "::error::A key file already exists. Refusing to overwrite it."
            exit 1
          fi

          keytool -genkeypair \
            -keystore release-key.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Happy Trading Alarm, OU=Development, O=Happy Trading Alarm, C=US"

          keytool -list \
            -keystore release-key.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Upload Signing Key
        uses: actions/upload-artifact@v4
        with:
          name: temporary-release-signing-key
          path: release-key.jks
          retention-days: 1
          if-no-files-found: error
